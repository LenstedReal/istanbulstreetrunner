name: Build Istanbul Street Runner APK

on:
  workflow_dispatch:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Configure public backend URL
        working-directory: frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: ${{ vars.EXPO_PUBLIC_BACKEND_URL }}
        run: |
          if [ -n "$EXPO_PUBLIC_BACKEND_URL" ]; then
            printf 'EXPO_PUBLIC_BACKEND_URL=%s\n' "$EXPO_PUBLIC_BACKEND_URL" > .env.production
          else
            echo "::warning::Repository variable EXPO_PUBLIC_BACKEND_URL is not set; online features will report a configuration error."
          fi

      - name: Generate Android project
        working-directory: frontend
        run: npx expo prebuild --clean --platform android --no-install

      - name: Patch Google Mobile Ads compileSdk
        working-directory: frontend
        run: |
          node -e "const fs=require('fs'); const p='node_modules/react-native-google-mobile-ads/android/build.gradle'; let s=fs.readFileSync(p,'utf8'); const m=s.match(/android\\s*\\{/); if(!m) throw Error('Android bloğu bulunamadı'); const i=m.index+m[0].length; let depth=1,j=i; for(;j<s.length&&depth;j++){if(s[j]==='{')depth++;else if(s[j]==='}')depth--;} const b=s.slice(i,j-1); if(!/^\\s*compileSdk(?:Version)?\\s+/m.test(b)) s=s.slice(0,i)+'\\n    compileSdk 36\\n'+s.slice(i); fs.writeFileSync(p,s); console.log('Google Mobile Ads compileSdk kontrol edildi');"
      - name: Build release APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: istanbulstreetrunner-apk
          path: frontend/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
