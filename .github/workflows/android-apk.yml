name: Build Istanbul Street Runner APK

on:
  workflow_dispatch:
  push:
    paths:
      - "frontend/**"
      - "scripts/verify_aab.py"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests (game logic)
        working-directory: frontend
        run: npm test

  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Free disk space
        # The release build compiles native code and needs more room than the
        # runner leaves free; remove toolchains this job never uses.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/lib/node_modules/@azure 2>/dev/null || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Configure public app environment
        working-directory: frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: ${{ vars.EXPO_PUBLIC_BACKEND_URL }}
          EXPO_PUBLIC_ADMOB_ANDROID_INTERSTITIAL: ${{ vars.EXPO_PUBLIC_ADMOB_ANDROID_INTERSTITIAL }}
          EXPO_PUBLIC_ADMOB_ANDROID_REWARDED: ${{ vars.EXPO_PUBLIC_ADMOB_ANDROID_REWARDED }}
          EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY: ${{ vars.EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY }}
          EXPO_PUBLIC_ADS_TEST_MODE: ${{ vars.EXPO_PUBLIC_ADS_TEST_MODE }}
        run: |
          set -eu
          : > .env.production
          if [ -n "$EXPO_PUBLIC_BACKEND_URL" ]; then
            printf 'EXPO_PUBLIC_BACKEND_URL=%s\n' "$EXPO_PUBLIC_BACKEND_URL" >> .env.production
          else
            echo "::warning::Repository variable EXPO_PUBLIC_BACKEND_URL is not set; online features may not work."
          fi
          test -n "$EXPO_PUBLIC_ADMOB_ANDROID_INTERSTITIAL"
          test -n "$EXPO_PUBLIC_ADMOB_ANDROID_REWARDED"
          test -n "$EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY"
          printf 'EXPO_PUBLIC_ADMOB_ANDROID_INTERSTITIAL=%s\n' "$EXPO_PUBLIC_ADMOB_ANDROID_INTERSTITIAL" >> .env.production
          printf 'EXPO_PUBLIC_ADMOB_ANDROID_REWARDED=%s\n' "$EXPO_PUBLIC_ADMOB_ANDROID_REWARDED" >> .env.production
          printf 'EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY=%s\n' "$EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY" >> .env.production
          # Google test ads unless the repository variable EXPO_PUBLIC_ADS_TEST_MODE is "0"
          # (set it to 0 only for the build that goes to Google Play).
          if [ "${EXPO_PUBLIC_ADS_TEST_MODE:-1}" != "0" ]; then
            printf 'EXPO_PUBLIC_ADS_TEST_MODE=1\n' >> .env.production
            echo "::notice::Ads test mode is ON: this build shows Google test ads."
          else
            echo "::notice::Ads test mode is OFF: this build requests real ads."
          fi
          echo "Backend, Android AdMob, and RevenueCat environment configured."

      - name: Generate Android project
        working-directory: frontend
        run: npx expo prebuild --clean --platform android --no-install

      - name: Patch Google Mobile Ads compileSdk
        working-directory: frontend
        run: |
          node -e "const fs=require('fs'); const p='node_modules/react-native-google-mobile-ads/android/build.gradle'; let s=fs.readFileSync(p,'utf8'); const m=s.match(/android\\s*\\{/); if(!m) throw Error('Android bloğu bulunamadı'); const i=m.index+m[0].length; let depth=1,j=i; for(;j<s.length&&depth;j++){if(s[j]==='{')depth++;else if(s[j]==='}')depth--;} const b=s.slice(i,j-1); if(!/^\\s*compileSdk(?:Version)?\\s+/m.test(b)) s=s.slice(0,i)+'\\n    compileSdk 36\\n'+s.slice(i); fs.writeFileSync(p,s); console.log('Google Mobile Ads compileSdk kontrol edildi');"
      - name: Configure Android upload signing
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          cat >> app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  ciRelease {
                      storeFile = file(System.getenv("RUNNER_TEMP") + "/upload.jks")
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.ciRelease
                  }
              }
          }
          GRADLE

      - name: Build release APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle-apk.log"

      - name: Build signed release AAB
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon bundleRelease 2>&1 | tee "$RUNNER_TEMP/gradle-aab.log"

      - name: Show the cause of a failed Gradle build
        if: failure()
        run: |
          echo "::group::Disk and memory"; df -h /; free -m; echo "::endgroup::"
          for f in "$RUNNER_TEMP"/gradle-*.log; do
            [ -f "$f" ] || continue
            echo "== $f"
            grep -n -A12 "What went wrong" "$f" || true
            grep -n -m 20 -E "Caused by|OutOfMemoryError|No space left|Keystore|Cannot recover key|Duplicate|ZipException|IOException" "$f" || true
          done

      - name: Upload Gradle logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            ${{ runner.temp }}/gradle-*.log
            frontend/android/build/reports/problems/problems-report.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: istanbulstreetrunner-apk
          path: frontend/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: istanbulstreetrunner-aab
          path: frontend/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Verify AAB manifest (target SDK, version, permissions, signer)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          python3 scripts/verify_aab.py "$(ls frontend/android/app/build/outputs/bundle/release/*.aab | head -1)" "$RUNNER_TEMP/bundletool.jar" frontend/app.json
